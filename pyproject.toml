[project]
name = "conga-transport"
version = "0.1.0"
description = "Compile conditionally Gaussian geometry before posterior inference"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Víctor Gallego" }]
dependencies = [
    "numba>=0.60,<1",
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "torch>=2.4,<3",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
experiments = [
    "arviz>=0.20,<2",
    "equinox>=0.11.12,<1",
    "flowjax>=17.1,<20",
    "jax[cpu]>=0.4.35,<1",
    "matplotlib>=3.7,<4",
    "nutpie>=0.16,<1",
    "walnutpie>=0.0.2,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conga"]

[tool.pytest.ini_options]
testpaths = ["tests"]
